<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>登录 · iperf3-fleet</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#e2e8f0;--muted:#94a3b8;--accent:#38bdf8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:32px 34px;width:360px;max-width:92vw;box-shadow:0 10px 40px rgba(0,0,0,.35)}
h1{font-size:20px;margin:0 0 4px;text-align:center}
.sub{color:var(--muted);font-size:13px;text-align:center;margin:0 0 22px}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
input{width:100%;background:#0f172a;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:9px 10px;font-size:14px}
input:focus{outline:none;border-color:var(--accent)}
button{width:100%;margin-top:18px;background:#0284c7;color:#fff;border:none;border-radius:6px;padding:10px;font-size:14px;cursor:pointer}
button:hover{background:#0369a1}
button:disabled{opacity:.6;cursor:default}
.err{color:#f87171;font-size:13px;text-align:center;min-height:18px;margin:10px 0 0}
.hint{color:var(--muted);font-size:12px;text-align:center;margin:6px 0 0;line-height:1.7}
</style>
</head>
<body>
<div class="card">
  <h1>📡 iperf3-fleet</h1>
  <p class="sub">多机线路质量测试面板 · 请登录</p>
  <label>用户名</label>
  <input id="user" autocomplete="username" autofocus/>
  <label>密码</label>
  <input id="password" type="password" autocomplete="current-password"/>
  <button id="btn">登 录</button>
  <p id="err" class="err"></p>
  <p class="hint">默认账号 admin，随机密码在部署完成的终端提示里<br>也可查看容器内 /data/auth.json</p>
</div>
<script>
const btn = document.getElementById('btn');
const err = document.getElementById('err');

async function login() {
  err.textContent = '';
  btn.disabled = true;
  btn.textContent = '登录中...';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({user: document.getElementById('user').value, password: document.getElementById('password').value})
    });
    const d = await res.json().catch(() => ({}));
    if (res.ok) { location.href = '/'; return; }
    err.textContent = d.error || '登录失败';
  } catch (e) {
    err.textContent = '网络错误: ' + e.message;
  }
  btn.disabled = false;
  btn.textContent = '登 录';
}
btn.addEventListener('click', login);
for (const id of ['user', 'password']) {
  document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
}
</script>
</body>
</html>
