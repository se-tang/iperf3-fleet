services:
  iperf3-fleet:
    build: .
    image: iperf3-fleet:latest
    container_name: iperf3-fleet
    restart: unless-stopped
    ports:
      # 对外端口在首次部署时随机生成并记录在 .env（PANEL_PORT=xxxx），升级/重启不变
      - "${PANEL_PORT:-8088}:8000"
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      # 横幅里显示的对外端口，与上面的端口映射保持一致
      PANEL_PORT: ${PANEL_PORT:-8088}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
