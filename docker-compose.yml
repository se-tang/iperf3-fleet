services:
  iperf3-fleet:
    build: .
    image: iperf3-fleet:latest
    container_name: iperf3-fleet
    restart: unless-stopped
    ports:
      - "8088:8000"
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      # 横幅里显示的对外端口，若修改上面的端口映射请同步修改这里
      PANEL_PORT: 8088
    volumes:
      - ./data:/data
